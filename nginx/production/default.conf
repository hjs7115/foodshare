limit_req_zone $binary_remote_addr zone=auth_attempts:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=image_uploads:10m rate=10r/m;

upstream foodshare_frontend {
    server frontend:80;
}

upstream foodshare_backend {
    server backend:8080;
}

server {
    listen 80;
    server_name bantting.store www.bantting.store;

    client_max_body_size 20m;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name bantting.store www.bantting.store;

    client_max_body_size 20m;

    ssl_certificate /etc/letsencrypt/live/bantting.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bantting.store/privkey.pem;

    limit_req_status 429;
    error_page 429 = @too_many_requests;
    location @too_many_requests {
        default_type application/json;
        add_header Retry-After 60 always;
        return 429 '{"success":false,"message":"시도가 너무 많아요. 잠시 후 다시 시도해주세요.","data":null}';
    }
    location ~ ^/api/auth/(login|signup|email-verifications|phone-verifications|password-reset-link|reset-password|find-email|find-id)(/|$) {
        limit_req zone=auth_attempts burst=10 nodelay;
        proxy_pass http://foodshare_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /api/uploads/images {
        limit_req zone=image_uploads burst=5 nodelay;
        proxy_pass http://foodshare_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://foodshare_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://foodshare_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/ {
        proxy_pass http://foodshare_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
    }

    location / {
        proxy_pass http://foodshare_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
