<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1160" viewBox="0 0 1800 1160" role="img"><title>반띵 운영 시스템 아키텍처</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1,1 L9,5 L1,9" fill="#54657e"/></marker><filter id="shadow" x="-10%" y="-10%" width="125%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity=".1"/></filter></defs><style>text{font-family:"Malgun Gothic","Segoe UI",sans-serif;fill:#172b49} .body{font-size:18px} .small{font-size:15px} .heading{font-size:26px;font-weight:700}</style>
<rect width="1800" height="1160" fill="#fbfcfe"/>
<text x="50" y="55" font-size="32" font-weight="700" text-anchor="start">반띵 · 운영 시스템 아키텍처</text>
<text x="50" y="85" font-size="17" font-weight="400" text-anchor="start">운영 소스·구성 확인 2026-10-27  |  AWS EC2 · Docker Compose · HTTPS</text>
<rect x="50" y="145" width="370" height="430" rx="12" fill="#e9f4ff" stroke="#5b9ee8" stroke-width="1.5"/>
<text x="72" y="182" font-size="25" font-weight="700" text-anchor="start">Client / PWA</text>
<text x="72" y="220" font-size="18" font-weight="400" text-anchor="start">React 18 · TypeScript · Vite 6</text>
<text x="72" y="250" font-size="18" font-weight="400" text-anchor="start">소개 페이지 / 설치형 앱</text>
<text x="72" y="280" font-size="18" font-weight="400" text-anchor="start">게시판 · 거래 · 실시간 채팅</text>
<text x="72" y="310" font-size="18" font-weight="400" text-anchor="start">내 냉장고 · 열린 냉장고 · 맞교환</text>
<text x="72" y="340" font-size="18" font-weight="400" text-anchor="start">사진 분석 · 한 끼 추천 · 저장 메뉴</text>
<text x="72" y="370" font-size="18" font-weight="400" text-anchor="start">주간 장보기 · 선택 알림</text>
<text x="72" y="400" font-size="18" font-weight="400" text-anchor="start">JWT / Refresh Token 갱신</text>
<text x="72" y="430" font-size="18" font-weight="400" text-anchor="start">기기별 FCM · 모바일 뒤로가기</text>
<rect x="520" y="145" width="700" height="150" rx="12" fill="#f0ecff" stroke="#a58add" stroke-width="1.5"/>
<text x="542" y="182" font-size="25" font-weight="700" text-anchor="start">Nginx / HTTPS Reverse Proxy</text>
<text x="542" y="220" font-size="18" font-weight="400" text-anchor="start">TLS 종료 · HTTP → HTTPS · 인증/업로드 IP 요청 제한</text>
<text x="542" y="250" font-size="18" font-weight="400" text-anchor="start">/ → Frontend Nginx   |   /api/ · /ws/ · /uploads/ → Backend</text>
<path d="M420,230 L520,230" fill="none" stroke="#54657e" stroke-width="2" marker-end="url(#a)"/>
<text x="470" y="210" font-size="15" font-weight="400" text-anchor="middle">HTTPS</text>
<path d="M870,295 L870,345" fill="none" stroke="#54657e" stroke-width="2" marker-end="url(#a)"/>
<text x="1005" y="325" font-size="15" font-weight="400" text-anchor="middle">REST / WebSocket</text>
<rect x="520" y="345" width="700" height="510" rx="12" fill="#e9f8ec" stroke="#65b678" stroke-width="1.5"/>
<text x="542" y="382" font-size="25" font-weight="700" text-anchor="start">API Server / Spring Boot 4.0.6</text>
<text x="542" y="420" font-size="18" font-weight="400" text-anchor="start">Java 21 · Spring Security · JWT · JPA</text>
<text x="542" y="450" font-size="18" font-weight="400" text-anchor="start">Controller / Service</text>
<text x="542" y="480" font-size="18" font-weight="400" text-anchor="start">인증 · 게시글 · 거래 · 채팅 · 리뷰 · 신고/차단</text>
<text x="542" y="510" font-size="18" font-weight="400" text-anchor="start">냉장고 · 선택 공개 · 맞교환 · 약속/취소</text>
<text x="542" y="540" font-size="18" font-weight="400" text-anchor="start">AI 사진 분석 · 메뉴 추천/저장 · 주간 장보기</text>
<text x="542" y="570" font-size="18" font-weight="400" text-anchor="start">Security / Validation</text>
<text x="542" y="600" font-size="18" font-weight="400" text-anchor="start">이메일 검증 · 인증 시도 제한 · 참여자/소유권 확인</text>
<text x="542" y="630" font-size="18" font-weight="400" text-anchor="start">이미지 디코딩 · 1,600px JPEG 재인코딩</text>
<text x="542" y="660" font-size="18" font-weight="400" text-anchor="start">Scheduler / Repository</text>
<text x="542" y="690" font-size="18" font-weight="400" text-anchor="start">기한 임박 · 주간 알림 · 제한적 푸시 재시도</text>
<text x="542" y="720" font-size="18" font-weight="400" text-anchor="start">MySQL 영속화 · 위치/공개/상태 필터</text>
<rect x="1330" y="345" width="420" height="320" rx="12" fill="#fff0c9" stroke="#e6a21f" stroke-width="1.5"/>
<text x="1352" y="382" font-size="25" font-weight="700" text-anchor="start">Database / MySQL 8.4</text>
<text x="1352" y="420" font-size="18" font-weight="400" text-anchor="start">같은 EC2의 Docker 컨테이너</text>
<text x="1352" y="450" font-size="18" font-weight="400" text-anchor="start">회원 · 인증 · 게시글 · AI 분석</text>
<text x="1352" y="480" font-size="18" font-weight="400" text-anchor="start">거래 · 채팅 · 리뷰 · 신고/차단</text>
<text x="1352" y="510" font-size="18" font-weight="400" text-anchor="start">냉장고 · 맞교환 · 주간 장보기</text>
<text x="1352" y="540" font-size="18" font-weight="400" text-anchor="start">저장 메뉴 · 알림 · FCM 토큰</text>
<text x="1352" y="570" font-size="18" font-weight="400" text-anchor="start">푸시 재시도 · 업로드 소유권</text>
<text x="1352" y="600" font-size="18" font-weight="400" text-anchor="start">mysql-data 영속 볼륨</text>
<path d="M1220,500 L1330,500" fill="none" stroke="#54657e" stroke-width="2" marker-end="url(#a)"/>
<text x="1275" y="480" font-size="15" font-weight="400" text-anchor="middle">JPA / SQL</text>
<rect x="1330" y="735" width="420" height="195" rx="12" fill="#f2f4f7" stroke="#98a2b3" stroke-width="1.5"/>
<text x="1352" y="772" font-size="25" font-weight="700" text-anchor="start">File Storage</text>
<text x="1352" y="810" font-size="18" font-weight="400" text-anchor="start">uploads-data 영속 볼륨</text>
<text x="1352" y="840" font-size="18" font-weight="400" text-anchor="start">검증한 사진 · 본인 소유권 확인</text>
<text x="1352" y="870" font-size="18" font-weight="400" text-anchor="start">기존 공유 파일 자동 삭제 없음</text>
<text x="1352" y="900" font-size="18" font-weight="400" text-anchor="start">DB와 별도로 파일 보존</text>
<path d="M1220,790 L1330,790" fill="none" stroke="#54657e" stroke-width="2" marker-end="url(#a)"/>
<text x="1275" y="770" font-size="15" font-weight="400" text-anchor="middle">이미지</text>
<rect x="50" y="675" width="370" height="180" rx="12" fill="#ffeaf2" stroke="#ee6f9d" stroke-width="1.5"/>
<text x="72" y="712" font-size="25" font-weight="700" text-anchor="start">Browser / Map APIs</text>
<text x="72" y="750" font-size="18" font-weight="400" text-anchor="start">Geolocation · 사용자 위치</text>
<text x="72" y="780" font-size="18" font-weight="400" text-anchor="start">Kakao Maps · 지도/주소</text>
<text x="72" y="810" font-size="18" font-weight="400" text-anchor="start">공개 응답: 동네·거리 중심</text>
<path d="M235,575 L235,675" fill="none" stroke="#54657e" stroke-width="2" marker-end="url(#a)"/>
<text x="295" y="630" font-size="15" font-weight="400" text-anchor="middle">위치/지도</text>
<rect x="520" y="945" width="700" height="165" rx="12" fill="#ffeaf2" stroke="#ee6f9d" stroke-width="1.5"/>
<text x="542" y="982" font-size="25" font-weight="700" text-anchor="start">External Services</text>
<text x="542" y="1020" font-size="18" font-weight="400" text-anchor="start">SMTP: 이메일 인증 · 비밀번호 재설정</text>
<text x="542" y="1050" font-size="18" font-weight="400" text-anchor="start">Firebase FCM: 기기별 푸시 · 일시 실패 재시도</text>
<text x="542" y="1080" font-size="18" font-weight="400" text-anchor="start">OpenAI: 식재료 사진 분석 · 한 끼 추천 (실패 시 기본 메뉴)</text>
<path d="M870,855 L870,945" fill="none" stroke="#54657e" stroke-width="2" marker-end="url(#a)"/>
<text x="995" y="902" font-size="15" font-weight="400" text-anchor="middle">메일 / 푸시 / AI</text>
<text x="50" y="1120" font-size="17" font-weight="400" text-anchor="start">RDS는 대체 구성 예시 · 운영 DB는 MySQL 컨테이너 · 비밀키/인증서는 코드와 분리</text>
</svg>